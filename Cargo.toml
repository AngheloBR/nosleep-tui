[package]
name = "nosleep-tui"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/AngheloBR/nosleep-tui"
description = "Impide la suspensión de tu laptop · systemd-logind + X11"
keywords = ["systemd", "logind", "tui", "power-management", "linux"]
categories = ["command-line-utilities"]

[[bin]]
name = "nosleep"
path = "src/main.rs"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
opt-level = 3

[dependencies]
clap = { version = "4.6.9", features = ["derive"] }
color-eyre = "0.6.5"
jiff = "1"
ratatui = "0.30"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
signal-hook = "0.4.6"
thiserror = "2.0.21"
x11rb = { version = "0.14", default-features = false, features = ["dpms"] }
zbus = "6"
# ⚠️ NADA de panic = "abort": los Drop DEBEN correr para restaurar xset
